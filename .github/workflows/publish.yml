name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos por defecto; cada trabajo pide solo lo que necesita
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6

      - name: Instalar entorno de Python (según uv.lock)
        run: uv sync --locked --no-dev

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: actions/configure-pages@v5

      - name: Compilar
        env:
          QUARTO_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: quarto render

      - name: Agregar firma invisible
        run: .venv/bin/python scripts/marca_de_agua.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
