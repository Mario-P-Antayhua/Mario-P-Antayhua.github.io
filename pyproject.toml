[project]
name = "apuntes-web"
version = "0.1.0"
description = "Sitio de apuntes de economía y econometría (Quarto)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "quarto-cli>=1.5",
]

[tool.uv]
package = false
